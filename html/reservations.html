    <div class="container-fluid">
        <div class="row">
            <div class="col-12 middle ">
                    <h1>Save your seats</h1>
                    <div class="reservation-options">
                        <button id="dineInBtn">Dine-In</button>
                        <button id="eventBtn">Special Event</button>
                    </div>

                  
            <div id="dineInForm" class="form-container" style="display:none;">
            <h2>Dine-In Reservation</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required><br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br><br>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required><br><br>

                <label for="date">Date:</label>
                <input type="date" id="date" name="date" required><br><br>

                <label for="time">Time:</label>
                <input type="time" id="time" name="time" required step="900">
                <button type="button" id="ampmToggle">AM</button><br><br>

                <label for="guests">Number of Guests:</label>
                <input type="number" id="guests" name="guests" required><br><br>

                <input type="submit" value="Submit">
            </form>
            </div>

            <div id="eventForm" class="form-container" style="display:none;">
            <h2>Special Event Reservation</h2>
            <form>
                <label for="eventName">Event Name:</label>
                <input type="text" id="eventName" name="eventName" required><br><br>

                <label for="organizer">Organizer Name:</label>
                <input type="text" id="organizer" name="organizer" required><br><br>

                <label for="emailEvent">Email:</label>
                <input type="email" id="emailEvent" name="emailEvent" required><br><br>

                <label for="phoneEvent">Phone Number:</label>
                <input type="tel" id="phoneEvent" name="phoneEvent" required><br><br>

                <label for="eventDate">Event Date:</label>
                <input type="date" id="eventDate" name="eventDate" required><br><br>

                <label for="eventTime">Event Time:</label>
                <input type="time" id="eventTime" name="eventTime" required step="900">
                <button type="button" id="eventAmPmToggle">AM</button><br><br>

                <label for="guestsEvent">Number of Guests:</label>
                <input type="number" id="guestsEvent" name="guestsEvent" required><br><br>

                <label for="details">Event Details:</label>
                <textarea id="details" name="details"></textarea><br><br>

                <input type="submit" value="Submit">
            </form>
            </div>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
